<title>দুর্গা পূজার শুভেচ্ছা কার্ড</title>

<style>
:root{--bg:#fff7e6;--ink:#3a1a0a;--panel:#fff;--line:#e8d3a8;--accent:#c4151c;--muted:#7a5a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d130c;--ink:#f6e7cf;--panel:#2a1b11;--line:#4a3322;--muted:#c9a77c}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.35rem;margin:0 0 4px}p.sub{margin:0 0 16px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:18px}
label{display:grid;gap:5px;font-weight:500;font-size:.92rem}
input[type=text],textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;resize:vertical}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--accent);color:#fff}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible,#ph label:focus-within{outline:3px solid #f0a020;outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;grid-column:1/-1}
#file{position:absolute;opacity:0;width:1px;height:1px}
#stage{width:100%;overflow:hidden;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.25)}

const D={quote:'“দুর্গা মানে শক্তি,\nদুর্গা মানে সাহস,\nদুর্গা মানে নতুন করে শুরু করার অনুপ্রেরণা।”',t1:'শারদীয়',t2:'দুর্গা পুজার',t3:'শুভেচ্ছা',
 body:'মা দুর্গার আগমনে জীবনের প্রতিটি পদক্ষেপে\nআসুক শান্তি, সমৃদ্ধি ও নতুন আশার আলো।\nসকলের জীবনে বিরাজ করুক সুখ, ভালোবাসা\nও অমঙ্গল নাশের শক্তি।',greet:'শুভ শারদীয় দুর্গোৎসব!',name:'ধনঞ্জয় চন্দ্র দাস'};

// title live lines (absolute in card coords relative to block)

tl.innerHTML='<div id="lt1" style="position:absolute;left:0;width:260px;top:2px;text-align:center"></div><div id="lt2" style="position:absolute;left:0;right:0;top:62px;text-align:center"></div><div id="lt3" style="position:absolute;left:0;right:0;top:200px;text-align:center"></div>';

const S={quote:{id:'quote',x:'in-quote',fs:27,lh:36,col:'#8a1a10',w:460,top:0,wt:500},

function fit(el,maxW,fs){el.style.fontSize=fs+'px';el.style.display='inline-block';let s=fs;while(el.scrollWidth>maxW&&s>10){s-=1;el.style.fontSize=s+'px'}}
function setBlock(k){const c=S[k],v=$(c.x).value,l=$('l-'+k),b=$(k);
 l.textContent=v;l.style.cssText+=`;top:0;font-size:${c.fs}px;line-height:${c.lh}px;color:${c.col};font-weight:${c.wt};white-space:pre`;
 let s=c.fs;l.style.left='0';l.style.right='auto';l.style.width='max-content';
 while(l.scrollWidth>c.w&&s>10){s--;l.style.fontSize=s+'px'}
 l.style.width='';l.style.left='0';l.style.right='0';
 b.classList.toggle('ed',v!==D[k==='greeting'?'greet':k]);}
function setTitle(){const a=$('in-t1').value,b=$('in-t2').value,c=$('in-t3').value;
 const ed=a!==D.t1||b!==D.t2||c!==D.t3;
 const f=(id,txt,fs,col,fam,wt,maxW,lh)=>{const e=$(id);e.textContent=txt;e.style.cssText+=`;font-family:${fam};font-weight:${wt};color:${col};white-space:pre;line-height:${lh}px;display:block`;
  e.style.width='max-content';let s=fs;e.style.fontSize=s+'px';while(e.scrollWidth>maxW&&s>14){s--;e.style.fontSize=s+'px'}
  e.style.width=id==='lt1'?'260px':''};
 $('title').classList.toggle('ed',ed);
 f('lt1',a,58,'#2a1a14',"'Hind Siliguri'",500,260,76);
 f('lt2',b,150,'#d3141a',"'Galada'",400,515,150);
 f('lt3',c,64,'#3a1a14',"'Hind Siliguri'",500,260,80);}

 const n=$('l-name');n.textContent=$('in-name').value;n.style.fontSize='29px';n.style.width='max-content';let s=29;while(n.scrollWidth>400&&s>12){s--;n.style.fontSize=s+'px'}n.style.width='';
 $('loc').textContent=$('in-loc').value}
function fill(){$('in-quote').value=D.quote;$('in-t1').value=D.t1;$('in-t2').value=D.t2;$('in-t3').value=D.t3;$('in-body').value=D.body;$('in-greet').value=D.greet;$('in-name').value=D.name;$('in-loc').value=''}

for(const k in focusMap)$(k).addEventListener('click',()=>$(focusMap[k]).focus());
const card=$('card'),stage=$('stage'),ph=$('ph'),img=$('img');
function rescale(){const s=Math.min(1,stage.clientWidth/1536);card.style.transform='scale('+s+')';stage.style.height=(1024*s)+'px';return s}
addEventListener('resize',rescale);rescale();
document.fonts.ready.then(setAll);setAll();
let st={x:0,y:0,z:1,base:1};
const PW=650,PH=904;
function apply(){img.style.transform=`translate(${st.x}px,${st.y}px) scale(${st.z*st.base})`}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{img.onload=()=>{st.base=Math.max(PW/img.naturalWidth,PH/img.naturalHeight);st.z=1;
  st.x=(PW-img.naturalWidth*st.base)/2;st.y=PH-img.naturalHeight*st.base;
  $('zoom').value=100;$('zoom').disabled=false;ph.classList.add('has');apply()};img.src=r.result};r.readAsDataURL(f);e.target.value=''};
$('zoom').oninput=e=>{const nz=e.target.value/100,k=nz/st.z,cx=PW/2,cy=PH*0.6;st.x=cx-(cx-st.x)*k;st.y=cy-(cy-st.y)*k;st.z=nz;apply()};
let drag=null;
ph.onpointerdown=e=>{if(!ph.classList.contains('has'))return;drag={x:e.clientX,y:e.clientY,sx:st.x,sy:st.y};ph.setPointerCapture(e.pointerId);ph.style.cursor='grabbing'};
ph.onpointermove=e=>{if(!drag)return;const s=rescale();st.x=drag.sx+(e.clientX-drag.x)/s;st.y=drag.sy+(e.clientY-drag.y)/s;apply()};
ph.onpointerup=ph.onpointercancel=()=>{drag=null;ph.style.cursor=''};
$('reset').onclick=()=>{ph.classList.remove('has');img.removeAttribute('src');$('zoom').disabled=true;fill();setAll()};
